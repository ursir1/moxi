name: Build & Release Moxi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.8.0
          run_install: false

      - name: Build Web UI (moxi-web)
        working-directory: moxi-web
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Determine Next Version
        id: release_info
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{}
          if ($env:GITHUB_TOKEN) {
            $headers["Authorization"] = "token $env:GITHUB_TOKEN"
          }
          $releases = try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers
          } catch {
            @()
          }

          $detectedVersions = @()
          foreach ($r in $releases) {
            if ($r.tag_name -match '^v?(\d+\.\d+\.\d+)$') {
              $detectedVersions += [version]$matches[1]
            }
            foreach ($a in $r.assets) {
              if ($a.name -match 'MoxiSetup-v?(\d+\.\d+\.\d+)') {
                $detectedVersions += [version]$matches[1]
              }
            }
          }

          if ($detectedVersions.Count -gt 0) {
            $latest = ($detectedVersions | Sort-Object -Descending)[0]
            $nextVersion = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          } else {
            $cargoContent = Get-Content "moxi-shell/Cargo.toml" -Raw
            if ($cargoContent -match '\[package\][\r\n]+name\s*=\s*"moxi-shell"[\r\n]+version\s*=\s*"(\d+\.\d+\.\d+)"') {
              $cur = [version]$matches[1]
              $nextVersion = "$($cur.Major).$($cur.Minor).$($cur.Build + 1)"
            } else {
              $nextVersion = "5.1.3"
            }
          }

          $tag = "v$nextVersion"
          "VERSION=$nextVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Determined Version: $nextVersion (Tag: $tag)"

          # Update Cargo.toml ONLY under [package] section
          $cargoPath = "moxi-shell/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $content = $content -replace '(?ms)(\[package\][\r\n]+name\s*=\s*"moxi-shell"[\r\n]+version\s*=\s*)"[^"]+"', "`$1`"$nextVersion`""
          [System.IO.File]::WriteAllText((Resolve-Path $cargoPath).Path, $content, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Updated moxi-shell/Cargo.toml to version $nextVersion"

          # Update Cargo.lock
          Set-Location moxi-shell
          cargo update -p moxi-shell
          Set-Location ..

          # Commit bumped files back to repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add moxi-shell/Cargo.toml moxi-shell/Cargo.lock
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-bump version to $nextVersion [skip ci]"
          git push origin main || Write-Host "Push skipped or already up to date"

      - name: Build Native Shell (moxi-shell)
        working-directory: moxi-shell
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Windows Installer
        working-directory: moxi-shell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup\Stremio.iss"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: "Moxi Desktop ${{ steps.release_info.outputs.TAG }}"
          body: |
            ## Moxi Desktop for Windows 🎬

            Automated release: **${{ steps.release_info.outputs.TAG }}**
            Triggered by commit:
            > ${{ github.event.head_commit.message }}

            ### 📦 Downloads:
            - **Windows Installer (`.exe`)**: Download `MoxiSetup-*.exe` below to install Moxi on your computer.
            - **Standalone Executable**: Download `moxi.exe` for portable usage.
          files: |
            moxi-shell/MoxiSetup*.exe
            moxi-shell/target/x86_64-pc-windows-msvc/release/moxi.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
